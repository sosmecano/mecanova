name: Keep Render Alive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -sS --max-time 30 https://mecanova.onrender.com/api/health
          echo ""
      - name: Ping admin dashboard
        run: |
          curl -sS -o /dev/null -w "admin HTTP %{http_code}\n" --max-time 30 https://mecanova-admin.vercel.app
