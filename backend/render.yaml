services:
  - type: web
    name: mecanova-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://mecanova-admin.vercel.app
      - key: ADMIN_PHONES
        sync: false
